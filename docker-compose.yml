version: "3.8"

services:
  # MongoDB database
  mongo:
    image: mongo:7
    container_name: mathina-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - mathina-net

  # Backend API (Express + Node.js)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mathina-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/cluckfresh_hub
      - NODE_ENV=production
      - PORT=5000
    depends_on:
      - mongo
    networks:
      - mathina-net

  # Frontend (Nginx serving React build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mathina-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mathina-net

volumes:
  mongo-data:

networks:
  mathina-net:
    driver: bridge
