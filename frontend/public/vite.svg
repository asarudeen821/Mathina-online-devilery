<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Glow -->
  <circle cx="50" cy="50" r="49" fill="#fca5a5" opacity="0.3"/>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#991b1b" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Inner Ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#fca5a5" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Chicken Icon Enhanced -->
  <g transform="translate(50, 52)" filter="url(#shadow)">
    
    <!-- Tail -->
    <path d="M -18 0 Q -28 -5 -32 2 Q -28 8 -20 6" fill="none" stroke="#fca5a5" stroke-width="3" stroke-linecap="round"/>
    <path d="M -18 4 Q -30 0 -34 6 Q -30 12 -22 10" fill="none" stroke="#f87171" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Body -->
    <ellipse cx="-5" cy="8" rx="22" ry="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <ellipse cx="-8" cy="5" rx="12" ry="8" fill="white" opacity="0.5"/>
    
    <!-- Wing -->
    <path d="M -15 8 Q -8 18 5 12" fill="none" stroke="#fca5a5" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Neck -->
    <ellipse cx="12" cy="0" rx="8" ry="10" fill="#fef2f2"/>
    
    <!-- Head -->
    <circle cx="18" cy="-10" r="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    
    <!-- Comb -->
    <path d="M 14 -20 Q 18 -28 22 -20 Q 26 -28 28 -18" fill="#dc2626" stroke="#991b1b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Beak -->
    <path d="M 28 -8 L 38 -5 L 28 -2 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
    
    <!-- Eye -->
    <circle cx="20" cy="-12" r="3" fill="#1f2937"/>
    <circle cx="21" cy="-13" r="1.5" fill="white"/>
    
    <!-- Wattle -->
    <ellipse cx="22" cy="-2" rx="4" ry="6" fill="#dc2626"/>
    
    <!-- Legs -->
    <line x1="-8" y1="22" x2="-12" y2="32" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="22" x2="12" y2="32" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Feet -->
    <path d="M -12 32 L -18 35 M -12 32 L -12 36 M -12 32 L -6 35" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 12 32 L 6 35 M 12 32 L 12 36 M 12 32 L 18 35" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Brand Name -->
  <text x="50" y="94" font-size="11" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-weight="bold" letter-spacing="1.5">MATHINA</text>
</svg>
